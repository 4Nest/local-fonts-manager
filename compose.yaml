name: local-fonts-manager
services:
  fonts-manager:
    build: .
    image: ghcr.io/4nest/local-fonts-manager-web:latest
    pull_policy: always
    container_name: local-fonts-manager
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Asia/Shanghai
      FONT_MANAGER_ROOT: /fonts
      FONT_MANAGER_STATE: /state
      FONT_MANAGER_HOST: 0.0.0.0
      FONT_MANAGER_PORT: 8765
    ports:
      - "${FONT_MANAGER_PORT:-8765}:8765"
    volumes:
      - ${FONT_LIBRARY_PATH:-/path/to/Fonts}:/fonts
      - ${FONT_STATE_PATH:-/vol3/docker/local-fonts-manager/state}:/state
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  font-ingest:
    build:
      context: ./legacy/ingest
    image: ghcr.io/4nest/local-fonts-manager-ingest:latest
    pull_policy: always
    container_name: local-fonts-manager-ingest
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Asia/Shanghai
      FONT_INGEST_STATE: /state
    volumes:
      - ${FONT_LIBRARY_PATH:-/path/to/Fonts}:/fonts
      - ${FONT_INGEST_STATE_PATH:-/vol3/docker/local-fonts-manager/ingest-state}:/state
      - ./legacy/ingest/config.nas.json:/app/config.json:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    stop_grace_period: 2m
    mem_limit: 1g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

