[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-fonts-manager"
version = "0.1.0"
description = "NAS 字体预览、整理、识别与通用 MCP 工具"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "fonttools[woff]>=4.62,<5",
  "Pillow>=11.3,<13",
  "mcp>=1.26,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
fonts-manager = "font_manager.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["font_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

